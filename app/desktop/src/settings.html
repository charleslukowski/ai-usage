<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Usage — Settings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="settings-page">
    <header class="sp-head">
      <h1>Providers</h1>
      <p class="sp-sub">Keys are stored in Windows Credential Manager, never in a file.</p>
    </header>

    <div id="list" class="sp-list"></div>

    <section class="shame">
      <div class="shame-h">No usage API &mdash; can't be tracked</div>
      <div class="shame-chips">
        <span class="sc">Claude Max</span>
        <span class="sc">Hugging Face</span>
        <span class="sc">Gemini</span>
        <span class="sc">Together</span>
        <span class="sc">Groq</span>
        <span class="sc">Replicate</span>
        <span class="sc">Resend</span>
        <span class="sc">Perplexity</span>
      </div>
      <div class="shame-sub">These won't let you read your own balance or spend.</div>
    </section>

    <footer class="sp-foot">
      <span id="saved" class="sp-saved"></span>
      <div class="sp-actions">
        <button id="close" class="ghostbtn" type="button">Close</button>
        <button id="save" class="primary" type="button">Save</button>
      </div>
    </footer>

    <script type="module" src="/settings.js"></script>
  </body>
</html>
